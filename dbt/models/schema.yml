version: 2

models:
  - name: stg_customers
    description: Clean customer records loaded from the MinIO landing zone.
    columns:
      - name: customer_id
        data_tests: [not_null, unique]
      - name: segment
        data_tests:
          - accepted_values:
              arguments:
                values: ['SMB','MID_MARKET','ENTERPRISE']

  - name: stg_orders
    columns:
      - name: order_id
        data_tests: [not_null, unique]
      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['DELIVERED','CONFIRMED','CANCELLED']
      - name: currency
        data_tests:
          - accepted_values:
              arguments:
                values: ['USD']

  - name: dim_customer
    columns:
      - name: customer_key
        data_tests: [not_null, unique]
      - name: customer_id
        data_tests: [not_null, unique]

  - name: dim_product
    columns:
      - name: product_key
        data_tests: [not_null, unique]
      - name: product_id
        data_tests: [not_null, unique]

  - name: dim_payment
    columns:
      - name: payment_key
        data_tests: [not_null, unique]

  - name: fact_orders
    columns:
      - name: order_id
        data_tests: [not_null, unique]
      - name: customer_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key
      - name: payment_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_payment')
                field: payment_key

  - name: fact_order_items
    columns:
      - name: order_item_id
        data_tests: [not_null, unique]
      - name: customer_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key
      - name: product_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key
